name: Actualizar precios de gasolineras
on:
  schedule:
    - cron: "20 6,18 * * *"   # 08:20 y 20:20 CEST aprox., tras la actualizacion diaria del Ministerio
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - name: Descargar y compactar precios
        run: python3 tools/update_data.py
      - name: Commit si hay cambios
        run: |
          git config user.name "gasole-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/stations.json
          git diff --cached --quiet || git commit -m "Precios: $(date -u +%Y-%m-%d)"
          git push
